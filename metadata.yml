Title: ADMET properties prediction
Description: Profiles a compound across 41 ADMET endpoints in one pass, spanning absorption, distribution, metabolism, excretion and toxicity. ADMET-AI, from Swanson and colleagues, fits an ensemble of five Chemprop models augmented with RDKit descriptors to the ADMET benchmark group of the Therapeutics Data Commons, of which 31 tasks are classification and 10 regression. Speed was the design goal, making it practical to profile entire virtual libraries, though each endpoint inherits the size and quality of its source dataset.
