Identifier: eos7m30
Slug: admet-ai-exact
Status: Ready
Title: ADMET properties prediction
Description: Profiles a compound across the 41 ADMET endpoints of the Therapeutics
  Data Commons collection (v0.4.1), 31 of them classification tasks and 10 regressions,
  and adds eight RDKit physicochemical properties for context. Swanson and colleagues
  trained a Chemprop-RDKit graph network per dataset, ensembling five scaffold-split
  replicates, and report the best average rank on the TDC leaderboard with a million
  molecules scored in about three hours. This build returns the raw predictions without
  the DrugBank percentile comparison.
