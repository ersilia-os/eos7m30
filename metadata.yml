Identifier: eos7m30
Slug: admet-ai-exact
Status: In maintenance
Title: ADMET properties prediction
Description: ADMET-AI is a framework for fast batch predictions of ADMET properties, based on an ensemble of 5 Chemprop-RDKit models. It was trained on 41 tasks (31 classification, 10 regression) from the Therapeutics Data Commons ADMET group (v0.4.1). Output includes 8 physicochemical properties: molecular weight, logP, H-bond acceptors/donors, Lipinski Rule of 5, QED, stereo centers, and TPSA. eos7d58 implements this model and additionally provides percentiles based on DrugBank-approved drugs.
